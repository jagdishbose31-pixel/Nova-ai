<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<title>NOVA AI</title>

<link rel="manifest" href="/manifest.json">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080b18;
  --panel: #10162a;
  --border: #283452;
  --text: #f4f6ff;
  --muted: #a4aecb;
  --blue: #4c8dff;
  --purple: #a855f7;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN SCREEN */

#authScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at top, #172454 0%, transparent 45%),
    var(--bg);
}

.auth-box {
  width: 100%;
  max-width: 390px;
  padding: 28px 22px;
  background: rgba(16, 22, 42, 0.96);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 0 40px rgba(76, 141, 255, 0.12);
}

.auth-logo {
  width: 100px;
  height: 100px;
  margin: 0 auto 12px;
  border-radius: 24px;
  overflow: hidden;
  background: #0b1025;
  box-shadow: 0 0 25px rgba(100, 90, 255, 0.3);
}

.auth-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-title {
  text-align: center;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #55c5ff, #bd72ff);
  -webkit-background-clip: text;
  color: transparent;
}

.brand-subtitle {
  text-align: center;
  color: var(--muted);
  margin: 8px 0 25px;
  font-size: 14px;
}

.auth-box h2 {
  text-align: center;
  margin-bottom: 20px;
}

.auth-input {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  color: white;
  background: #090e20;
}

.auth-input:focus {
  border-color: var(--blue);
}

.primary-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: bold;
  background: linear-gradient(100deg, #367dff, #9547ec);
  margin-top: 4px;
}

.primary-btn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.auth-switch {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-top: 18px;
}

.auth-switch button {
  color: #83b5ff;
  background: none;
  border: none;
  font-weight: bold;
}

.auth-error {
  color: #ff8d9c;
  font-size: 13px;
  line-height: 1.5;
  margin-bottom: 12px;
  text-align: center;
}

/* MAIN APP */

.app {
  max-width: 1000px;
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 12px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--panel);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.logo-icon {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 13px;
  background: #0b1025;
  box-shadow: 0 0 16px rgba(112, 87, 255, 0.25);
}

.logo-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header h1 {
  font-size: 20px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #55c5ff, #bd72ff);
  -webkit-background-clip: text;
  color: transparent;
}

.header small {
  display: block;
  color: #91a0c5;
  font-size: 11px;
  margin-top: 4px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.small-btn {
  padding: 9px 11px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: #151e38;
  color: white;
  font-size: 12px;
}

.pro-btn {
  background: linear-gradient(100deg, #ffb52e, #ff6b8a);
  color: #1b1020;
  border: none;
  font-weight: bold;
}

#userEmail {
  color: var(--muted);
  font-size: 11px;
  padding: 8px;
  overflow-wrap: anywhere;
}

/* CHAT AREA */

.chat {
  flex: 1;
  min-height: 300px;
  margin: 12px 0;
  padding: 16px 10px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: rgba(16, 22, 42, 0.55);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 16px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
}

.message.bot {
  align-self: flex-start;
  background: #151e38;
  border: 1px solid #263657;
  border-bottom-left-radius: 4px;
}

.message.user {
  align-self: flex-end;
  background: linear-gradient(120deg, #2865cf, #7443c6);
  border-bottom-right-radius: 4px;
}

.message.loading {
  color: #9abaff;
  font-style: italic;
}

.chat-tools {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.tool-btn {
  flex: 1;
  padding: 10px 6px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--panel);
  color: #c8d6ff;
  font-size: 12px;
}

/* INPUT */

.input-area {
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
}

.input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

#messageInput {
  min-width: 0;
  flex: 1;
  padding: 13px;
  background: #080d1e;
  color: white;
  border: 1px solid #263657;
  border-radius: 13px;
  outline: none;
}

#messageInput:focus {
  border-color: var(--blue);
}

.icon-btn {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 13px;
  color: white;
  background: #192443;
  font-size: 18px;
}

.send-btn {
  background: linear-gradient(130deg, #367dff, #9547ec);
  border: none;
}

.footer-note {
  color: #7785a9;
  text-align: center;
  font-size: 11px;
  padding: 12px 4px 5px;
}

/* HISTORY */

.history-panel {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel);
}

.history-panel h3 {
  font-size: 14px;
  margin-bottom: 10px;
}

.history-item {
  padding: 10px;
  margin-top: 6px;
  border-radius: 9px;
  background: #192443;
  color: #dbe5ff;
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* SMALL SCREEN */

@media (max-width: 420px) {
  .app {
    padding: 7px;
  }

  .header {
    padding: 9px;
  }

  .header h1 {
    font-size: 17px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
  }

  .small-btn {
    padding: 8px;
    font-size: 11px;
  }

  .message {
    max-width: 94%;
    font-size: 14px;
  }

  .chat {
    padding: 12px 7px;
  }
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->

<section id="authScreen">
  <div class="auth-box">

    <div class="auth-logo">
      <img src="/nova-mark.png" alt="NOVA AI Logo">
    </div>

    <div class="brand-title">NOVA AI</div>
    <div class="brand-subtitle">Your personal AI assistant</div>

    <h2 id="authTitle">Welcome Back</h2>

    <div id="authError" class="auth-error"></div>

    <form id="authForm">
      <input
        id="emailInput"
        class="auth-input"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="passwordInput"
        class="auth-input"
        type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button id="authSubmit" class="primary-btn" type="submit">
        Login
      </button>
    </form>

    <div class="auth-switch">
      <span id="switchText">Don't have an account?</span>
      <button id="switchButton" type="button">Sign Up</button>
    </div>

  </div>
</section>

<!-- MAIN CHAT APP -->

<main id="mainApp" class="app hidden">

  <header class="header">

    <div class="header-brand">
      <div class="logo-icon">
        <img src="/nova-mark.png" alt="NOVA">
      </div>

      <div>
        <h1>NOVA AI</h1>
        <small>Your AI assistant</small>
      </div>
    </div>

    <div class="header-actions">
      <button class="small-btn pro-btn" onclick="showPro()">
        ✦ PRO
      </button>

      <button class="small-btn" onclick="logout()">
        Logout
      </button>
    </div>

  </header>

  <div id="userEmail"></div>

  <section id="chat" class="chat" aria-live="polite"></section>

  <div class="chat-tools">
    <button class="tool-btn" onclick="newChat()">＋ New Chat</button>
    <button class="tool-btn" onclick="showHistory()">◷ History</button>
    <button class="tool-btn" onclick="clearChat()">⌫ Clear</button>
  </div>

  <section id="historyPanel" class="history-panel hidden">
    <h3>Recent chats</h3>
    <div id="historyList"></div>
  </section>

  <section class="input-area">
    <div class="input-row">

      <button
        class="icon-btn"
        onclick="startVoice()"
        title="Voice input"
        aria-label="Voice input"
      >🎙</button>

      <input
        id="messageInput"
        type="text"
        placeholder="Ask NOVA anything..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        class="icon-btn send-btn"
        onclick="sendMessage()"
        aria-label="Send message"
      >➤</button>

    </div>
  </section>

  <div class="footer-note">
    NOVA AI can make mistakes. Check important information.
  </div>

</main>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyALCoenxA0FPBkKONsu8i-R3Lxdo5_TMwg",
  authDomain: "nova-ai-ec9ca.firebaseapp.com",
  projectId: "nova-ai-ec9ca",
  storageBucket: "nova-ai-ec9ca.firebasestorage.app",
  messagingSenderId: "919732031996",
  appId: "1:919732031996:web:f268e37629a509c60fa279",
  measurementId: "G-FHZM5K7FYL"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);


/* APP STATE */

let isSignup = false;
let history = [];
let isSending = false;

const authScreen = document.getElementById("authScreen");
const mainApp = document.getElementById("mainApp");
const authForm = document.getElementById("authForm");
const authError = document.getElementById("authError");
const authTitle = document.getElementById("authTitle");
const authSubmit = document.getElementById("authSubmit");
const switchText = document.getElementById("switchText");
const switchButton = document.getElementById("switchButton");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const userEmail = document.getElementById("userEmail");
const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const historyPanel = document.getElementById("historyPanel");
const historyList = document.getElementById("historyList");


/* AUTH SCREEN */

function updateAuthScreen() {
  authError.textContent = "";

  if (isSignup) {
    authTitle.textContent = "Create Account";
    authSubmit.textContent = "Sign Up";
    switchText.textContent = "Already have an account?";
    switchButton.textContent = "Login";
    passwordInput.autocomplete = "new-password";
  } else {
    authTitle.textContent = "Welcome Back";
    authSubmit.textContent = "Login";
    switchText.textContent = "Don't have an account?";
    switchButton.textContent = "Sign Up";
    passwordInput.autocomplete = "current-password";
  }
}

switchButton.addEventListener("click", () => {
  isSignup = !isSignup;
  updateAuthScreen();
});

function readableAuthError(error) {
  const code = error?.code || "";

  if (code.includes("email-already-in-use")) {
    return "This email already has an account. Please log in.";
  }

  if (code.includes("invalid-email")) {
    return "Please enter a valid email address.";
  }

  if (
    code.includes("invalid-credential") ||
    code.includes("wrong-password") ||
    code.includes("user-not-found")
  ) {
    return "Email or password is incorrect.";
  }

  if (code.includes("weak-password")) {
    return "Please use a stronger password with at least 6 characters.";
  }

  if (code.includes("network-request-failed")) {
    return "Internet connection problem. Please try again.";
  }

  if (code.includes("too-many-requests")) {
    return "Too many attempts. Please wait and try again later.";
  }

  return error?.message || "Something went wrong. Please try again.";
}

authForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  authError.textContent = "";
  authSubmit.disabled = true;
  authSubmit.textContent = "Please wait...";

  try {
    if (isSignup) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (error) {
    authError.textContent = readableAuthError(error);
  } finally {
    authSubmit.disabled = false;
    updateAuthScreen();
  }
});


/* ACCOUNT-SPECIFIC CHAT STORAGE */

function storageKey() {
  const uid = auth.currentUser?.uid;

  return uid ? "nova_history_" + uid : "nova_history_guest";
}

function saveHistory() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(history));
  } catch (error) {
    console.error("Could not save chat history:", error);
  }
}

function loadChat() {
  try {
    history = JSON.parse(localStorage.getItem(storageKey()) || "[]");

    if (!Array.isArray(history)) {
      history = [];
    }
  } catch (error) {
    history = [];
  }

  chat.innerHTML = "";

  if (history.length === 0) {
    addMessage(
      "Hi! 😊 Main NOVA AI hoon. Tum mujhse kuch bhi puch sakte ho.",
      "bot",
      false
    );
  } else {
    history.forEach((item) => {
      if (item && typeof item.text === "string") {
        addMessage(item.text, item.type, false);
      }
    });
  }

  chat.scrollTop = chat.scrollHeight;
}


/* AUTH STATE */

onAuthStateChanged(auth, (user) => {
  if (user) {
    authScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");

    userEmail.textContent = "Logged in: " + (user.email || "");
    loadChat();
  } else {
    mainApp.classList.add("hidden");
    authScreen.classList.remove("hidden");

    history = [];
    chat.innerHTML = "";
    emailInput.value = "";
    passwordInput.value = "";
  }
});


/* LOGOUT */

window.logout = async function () {
  if (isSending) {
    alert("Please wait until NOVA finishes the current reply.");
    return;
  }

  try {
    await signOut(auth);
  } catch (error) {
    alert("Logout failed. Please try again.");
  }
};


/* DISPLAY MESSAGE */

function addMessage(text, type = "bot", save = true) {
  const message = document.createElement("div");

  message.className = "message " + type;
  message.textContent = text;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;

  if (save && (type === "user" || type === "bot")) {
    history.push({
      text: text,
      type: type,
      time: Date.now()
    });

    saveHistory();
  }

  return message;
}


/* SEND MESSAGE TO NOVA SERVER */

window.sendMessage = async function () {
  const text = messageInput.value.trim();

  if (!text || isSending) {
    return;
  }

  if (!auth.currentUser) {
    alert("Please log in first.");
    return;
  }

  isSending = true;
  sendButton.disabled = true;
  messageInput.disabled = true;

  addMessage(text, "user", true);
  messageInput.value = "";

  const loadingMessage = addMessage(
    "NOVA is thinking... ✨",
    "loading",
    false
  );

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(
        data?.error?.message ||
        data?.error ||
        data?.message ||
        "Server error (" + response.status + ")."
      );
    }

    let answer =
      data.reply ||
      data.answer ||
      data.message ||
      data?.choices?.[0]?.message?.content;

    if (typeof answer !== "string" || !answer.trim()) {
      throw new Error("NOVA received an empty reply. Please try again.");
    }

    loadingMessage.remove();
    addMessage(answer.trim(), "bot", true);

  } catch (error) {
    console.error("NOVA chat error:", error);

    loadingMessage.remove();

    addMessage(
      "Sorry bhai, abhi reply nahi aa paya. Internet check karo aur dobara try karo.\n\nError: " +
      (error.message || "Unknown error"),
      "bot",
      false
    );

  } finally {
    isSending = false;
    sendButton.disabled = false;
    messageInput.disabled = false;
    messageInput.focus();
  }
};


/* ENTER TO SEND */

messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    window.sendMessage();
  }
});


/* NEW CHAT */

window.newChat = function () {
  if (isSending) {
    alert("Please wait until the current reply is finished.");
    return;
  }

  history = [];
  saveHistory();

  chat.innerHTML = "";

  addMessage(
    "New chat started! 🚀 Batao bhai, kya puchna hai?",
    "bot",
    false
  );

  historyPanel.classList.add("hidden");
  messageInput.focus();
};


/* CLEAR CHAT */

window.clearChat = function () {
  if (isSending) {
    alert("Please wait until the current reply is finished.");
    return;
  }

  const confirmed = confirm("Bhai, kya tum apni saved chat history clear karna chahte ho?");

  if (!confirmed) {
    return;
  }

  history = [];
  saveHistory();

  chat.innerHTML = "";

  addMessage(
    "Chat cleared! 😊 Ab naya sawaal pucho.",
    "bot",
    false
  );

  historyPanel.classList.add("hidden");
};


/* CHAT HISTORY */

window.showHistory = function () {
  historyPanel.classList.toggle("hidden");
  historyList.innerHTML = "";

  if (history.length === 0) {
    historyList.textContent = "Abhi koi saved message nahi hai.";
    return;
  }

  const recentMessages = history
    .filter(item => item.type === "user")
    .slice(-10)
    .reverse();

  if (recentMessages.length === 0) {
    historyList.textContent = "Abhi koi chat nahi hai.";
    return;
  }

  recentMessages.forEach((item) => {
    const row = document.createElement("div");

    row.className = "history-item";
    row.textContent = item.text.length > 90
      ? item.text.slice(0, 90) + "..."
      : item.text;

    historyList.appendChild(row);
  });
};


/* VOICE INPUT */

window.startVoice = function () {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported in this browser. Try Chrome.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    messageInput.placeholder = "Listening... Bolo bhai 🎙";
  };

  recognition.onresult = (event) => {
    const spokenText = event.results[0][0].transcript;

    messageInput.value = spokenText;
    messageInput.focus();
  };

  recognition.onerror = (event) => {
    console.error("Voice input error:", event.error);
    alert("Voice input nahi chala. Microphone permission aur internet check karo.");
  };

  recognition.onend = () => {
    messageInput.placeholder = "Ask NOVA anything...";
  };

  try {
    recognition.start();
  } catch (error) {
    alert("Microphone start nahi hua. Dobara try karo.");
  }
};


/* PRO BUTTON */

window.showPro = function () {
  alert(
    "✨ NOVA AI PRO\n\n" +
    "PRO subscription feature abhi setup nahi hai.\n\n" +
    "Abhi tum normal NOVA AI chat use kar sakte ho."
  );
};


/* INITIAL SETUP */

updateAuthScreen();

</script>

</body>
</html>
